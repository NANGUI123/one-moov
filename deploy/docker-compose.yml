# API One Moov sur un VPS : PostgreSQL + API + Caddy (HTTPS automatique).
# Lancé par deploy/install.sh. Seul Caddy est exposé (ports 80/443).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: onemoov
      POSTGRES_USER: onemoov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onemoov -d onemoov"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://onemoov:${POSTGRES_PASSWORD}@db:5432/onemoov
      PUBLIC_BASE_URL: https://${API_DOMAIN:?API_DOMAIN manquant dans deploy/.env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
