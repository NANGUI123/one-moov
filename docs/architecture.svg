<text x="922" y="602.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="12.5" fill="#5B6676" text-anchor="start">lexicale et vectorielle, fusionnées par RRF (k = 60) ; chaque passage cite sa source</text>
<rect x="904" y="626" width="632" height="62" rx="6" fill="#EFF3F9" stroke="#CBD6E6" stroke-width="1"/>
<rect x="904" y="626" width="5" height="62" rx="2" fill="#0E1F3C"/>
