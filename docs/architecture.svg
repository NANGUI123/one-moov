<text x="800.0" y="547.0" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="13" fill="#5B6676" text-anchor="middle">tout nombre sorti du modèle est confronté au contexte vérifié ;</text>
<text x="800.0" y="564.0" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="13" fill="#5B6676" text-anchor="middle">sans correspondance, la phrase est remplacée par sa source</text>
<text x="800.0" y="595.0" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="13" fill="#E27D2E" text-anchor="middle" font-weight="600">services/garde_faits.py · 15 tests</text>
</g>
