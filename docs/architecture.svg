<text x="896" y="882" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="13" fill="#5B6676" text-anchor="start">Reconstruit par un script ; la clé d'unicité est le titre, deux documents pouvant partager une page.</text>
