<text x="40" y="1096" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="14" fill="#5B6676" text-anchor="start" font-style="italic">Trait plein : la demande descend, la réponse remonte par le même chemin.    Pointillé : asynchrone.    Orange : du texte.    Marine : un fait.</text>
