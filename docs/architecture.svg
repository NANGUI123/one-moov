<text x="82" y="610.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="12.5" fill="#5B6676" text-anchor="start">le parcours reste utilisable et le motif est affiché</text>
<rect x="64" y="640" width="632" height="56" rx="6" fill="#FFFFFF" stroke="#C3CBD8" stroke-width="1"/>
<text x="76" y="664.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="14.5" fill="#0E1F3C" text-anchor="start" font-weight="600">Quotas — appels comptés en base</text>
<text x="76" y="686.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="12.5" fill="#5B6676" text-anchor="start">au plafond, bascule en mode guidé avec son motif</text>
<text x="64" y="724" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="14" fill="#5B6676" text-anchor="start" font-style="italic">produit : reformulations, questions, explications</text>
<rect x="730" y="330" width="140" height="430" rx="6" fill="#FFF8F1" stroke="#E27D2E" stroke-width="3"/>
