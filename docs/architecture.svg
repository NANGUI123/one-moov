<text x="922" y="672.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="12.5" fill="#5B6676" text-anchor="start">l'export officiel décide ; le modèle relié au web n'ajoute qu'un complément marqué non confirmé</text>
