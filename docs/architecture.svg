<text x="56" y="865" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="13" fill="#5B6676" text-anchor="start">Comptes (empreinte bcrypt), pistes, formations, étapes, consommation de jetons.</text>
<text x="56" y="882" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="13" fill="#5B6676" text-anchor="start">Aucune conversation n'est conservée, pour personne. La suppression d'un compte efface en cascade, sans</text>
