<text x="922" y="532.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="12.5" fill="#5B6676" text-anchor="start">DAP blanche, DAP jaune ou Hors-DAP ; trois vœux ou sept, selon le champ visé</text>
