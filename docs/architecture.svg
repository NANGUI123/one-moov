<text x="64" y="366" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="23" fill="#FFFFFF" text-anchor="start" font-weight="600">Le modèle propose</text>
<text x="696" y="365" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="14" fill="#FBE3CB" text-anchor="end">il ne fixe aucune valeur</text>
<text x="64" y="406" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="16" fill="#0E1F3C" text-anchor="start" font-weight="600">Orchestrateur · trois niveaux de repli</text>
<rect x="64" y="416" width="632" height="66" rx="6" fill="#FDF2E7" stroke="#EFD6BC" stroke-width="1"/>
<rect x="64" y="416" width="5" height="66" rx="2" fill="#E27D2E"/>
<text x="82" y="440.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="14.5" fill="#0E1F3C" text-anchor="start" font-weight="600">Niveau 1 — fournisseur nominal</text>
<text x="82" y="462.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="12.5" fill="#5B6676" text-anchor="start">deux modèles essayés dans l'ordre ; le petit traite les tâches simples</text>
<rect x="64" y="490" width="632" height="66" rx="6" fill="#FDF2E7" stroke="#EFD6BC" stroke-width="1"/>
<rect x="64" y="490" width="5" height="66" rx="2" fill="#E27D2E"/>
<text x="82" y="514.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="14.5" fill="#0E1F3C" text-anchor="start" font-weight="600">Niveau 2 — secours chez un autre hébergeur</text>
<text x="82" y="536.5" font-family="Carlito, Calibri, DejaVu Sans, sans-serif" font-size="12.5" fill="#5B6676" text-anchor="start">couvre la panne de l'hébergeur, pas seulement celle d'un modèle</text>
<rect x="64" y="564" width="632" height="66" rx="6" fill="#FDF2E7" stroke="#EFD6BC" stroke-width="1"/>
<rect x="64" y="564" width="5" height="66" rx="2" fill="#E27D2E"/>
